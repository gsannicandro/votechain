<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #334155;
    }

    .wrapper {
      width: 100%;
      table-layout: fixed;
      background-color: #F8FAFC;
      padding-bottom: 40px;
    }

    .content {
      max-width: 480px;
      margin: 0 auto;
      background-color: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(11, 18, 32, 0.06);
    }

    .header {
      background: linear-gradient(180deg, #2176AE, #1b628f);
      padding: 32px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      color: #ffffff;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .body {
      padding: 40px 32px;
      text-align: center;
    }

    .otp-box {
      background: linear-gradient(180deg, #f7fafc, #ffffff);
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 18px;
      margin: 24px 0;
      font-family: 'Courier New', Courier, monospace;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 6px;
      color: #2176AE;
    }

    .footer {
      padding: 24px;
      text-align: center;
      font-size: 12px;
      color: #94a3b8;
    }

    p {
      margin: 0 0 16px;
      line-height: 1.6;
      color: #334155;
    }
  </style>
</head>

<body>
  <table class="wrapper" role="presentation" cellpadding="0" cellspacing="0">
    <tr>
      <td align="center" style="padding-top: 40px;">
        <table class="content" role="presentation" cellpadding="0" cellspacing="0" width="100%">
          <!-- Header -->
          <tr>
            <td class="header">
              <h1>VoteChain</h1>
            </td>
          </tr>
          <!-- Body -->
          <tr>
            <td class="body">
              <p style="font-size: 18px; margin-bottom: 24px;">Ciao,</p>
              <p>Ecco il tuo codice di verifica per accedere. Non condividere mai questo codice con nessuno.</p>
              <div class="otp-box">{{CODE}}</div>
              <p style="font-size: 14px; color: #52525b;">Il codice scadrà tra 10 minuti.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>

</html>
